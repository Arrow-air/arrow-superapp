<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrow</title>
    <script>
      // Apply the saved theme before first paint so there's no flash.
      try { document.documentElement.dataset.theme = localStorage.getItem('arrow.theme') || 'system'; }
      catch { document.documentElement.dataset.theme = 'system'; }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
